spec:
  positioning: 把公域粉丝合规沉淀为私域资产并培育成交的增收引擎
  users: 知识付费/带货类创作者（专栏转化率 5-8% 的存量群体，据 R2 调研）
  boundary: 做：钩子设计、培育 SOP、私域内容日历、成交话术；不做：承诺转化率、代用户收款/签约、不设计任何违反平台导流规则的"硬引流"话术
  kpi: 私域添加率提升（相对基线）；7 天培育 SOP 完成率；转化率从 <1% 基线（据 R2 调研）向 2-3% 区间爬坡
  roi_summary: 知识付费市场约 2808.8 亿元（据 R2 调研，艾媒咨询）；转化率 +1pct 对月收入即数百元增量，ROI 以"增收"计远超创作类
  demand_refs:
  - D21
  - D26
  - D07
  demand_support: 充分
  demand_evidence: 中
